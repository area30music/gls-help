# Pubblica la web app (cartella web/) su GitHub Pages a ogni push su main
name: Pubblica web app

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pubblica-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Numero di versione
        run: |
          V="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          sed -i "s/__VERSIONE__/$V/g" web/sw.js web/js/config.js
          echo "Versione $V"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
