# Pubblica il server (cartella worker/) su Cloudflare Workers a ogni push su main
name: Pubblica server

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/pubblica-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Numero di versione
        run: sed -i "s/__VERSIONE__/$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}/g" worker/src/index.js

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4'
          # Chiavi passate al server come secret di Cloudflare (mai nel codice)
          secrets: |
            GEMINI_API_KEY
            YOUTUBE_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
